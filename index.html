<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL 3RAB BOT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .bot-logo {
            font-size: 64px;
            margin-bottom: 16px;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .username {
            display: inline-block;
            background-color: #21262d;
            color: #58a6ff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
            direction: ltr;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
            color: #8b949e;
        }

        p b {
            color: #c9d1d9;
        }

        .btn-launch {
            display: block;
            background-color: #24A1DE;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 24px;
            margin-bottom: 20px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-launch:hover {
            background-color: #1a82b8;
            transform: translateY(-2px);
        }

        .footer-note {
            font-size: 13px;
            color: #6e7681;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشعار البرمجي للبوت -->
        <div class="bot-logo">🤖</div>

        <!-- العناوين -->
        <h1>AL 3RAB BOT</h1>
        <span class="username">@Al3Rab_IchanyBot</span>

        <p>انتقل إلى البوت الرسمي فوراً للحصول على الخدمات بدون إعلانات أو فترات انتظار.</p>
        <p><b>يمكنك دخوله مباشرة الآن:</b></p>

        <!-- زر الانتقال الفوري مع رابط الإحالة الخاص بك -->
        <a href="https://t.me/Al3Rab_IchanyBot?start=2048037478" class="btn-launch" target="_blank">
            اضغط هنا لفتح البوت عبر تليجرام
        </a>

        <div class="footer-note">
            سيتم تحويلك بشكل آمن ومباشر إلى التطبيق الرسمي.
        </div>
    </div>

</body>
</html>
